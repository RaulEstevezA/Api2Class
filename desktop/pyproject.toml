[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api2class"
version = "0.1.0"
description = "Desktop tool that turns JSON API responses into typed models for many languages, locally."
readme = "README_en.md"
license = "MIT"
authors = [{ name = "Raul Estevez" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.17"]
# Packaging the app (packaging/api2class.spec); Pillow only regenerates the icons
build = ["pyinstaller>=6.22", "pillow>=11.0"]

[project.scripts]
api2class = "api2class.__main__:main"

[tool.setuptools.packages.find]
include = ["api2class*"]

[tool.setuptools.package-data]
api2class = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
